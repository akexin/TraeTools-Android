name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 纯 Android 项目：只构建 APK，不再有任何 Windows 构建作业。
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Android workload：含 Microsoft.Android SDK / OpenJDK 等构建依赖（首次安装约 5-10 分钟）
      - name: Install Android workload
        run: dotnet workload install android

      # 单目标（net10.0-android）项目，不需要 EnableWindowsTargeting
      - name: Build Android (Release)
        run: dotnet build TraeTools.csproj -c Release --nologo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-tools-android-build
          path: bin/Release/net10.0-android/
          if-no-files-found: error
