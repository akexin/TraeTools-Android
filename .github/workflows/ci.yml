name: CI

# ⚠️ 临时验证用工作流（分支 verify-upstream-android 专属，非产品代码，验证完即删分支）。
#
# 目的：在 fork 上原样复现上游 star620/TraeTools 的 `android` 分支（9369fe5）的 Android 构建。
#
# 为什么改写的是 ci.yml 而不是用上游的 android.yml：
#   GitHub 的 workflow_dispatch 只能触发「默认分支上已注册的 workflow」。
#   本 fork 默认分支 main 上注册的是 ci.yml / release.yml / bump-version.yml /
#   rotate-keystore.yml / checkin.yml，**没有 android.yml**，
#   直接 dispatch android.yml 会 404。因此把要跑的作业写进已注册的 ci.yml。
#
# 只保留 workflow_dispatch 触发：避免推送该分支时误跑。
# 不含 build-windows：本仓库是纯 Android 产品线，且验证目标只是 Android 构建。

on:
  workflow_dispatch:

permissions:
  contents: write   # 需要 write 才能把 APK 发成 prerelease 资产（便于公开下载）

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Android workload：含 Microsoft.Android SDK / OpenJDK 等构建依赖（首次安装约 5-10 分钟）
      - name: Install Android workload
        run: dotnet workload install android

      # 与上游 android.yml 的 build-android 作业完全一致
      - name: Build Android (Release)
        run: dotnet build Android/TraeTools.Android.csproj -c Release --nologo

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trae-tools-android-apk
          path: Android/bin/Release/net10.0-android/*.apk
          if-no-files-found: error

      # 同时发一份到 prerelease：artifact 下载必须带令牌（本机网络下仅约 10 KB/s），
      # 而 Release 资产是公开 URL，可经镜像加速下载，且手机上能直接点链接安装。
      # 用固定 tag，重复跑会覆盖同一个 prerelease 的资产。
      - name: Publish APK as prerelease asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: upstream-android-1.3.3-verify
          name: "TraeTools Android（上游 android@9369fe5 构建复现）"
          prerelease: true
          generate_release_notes: false
          body: |
            上游 `star620/TraeTools` 的 `android` 分支（`9369fe5`）的 Android 构建复现产物。

            - 由本仓库临时分支 `verify-upstream-android` 构建，仅用于验证「上游安卓版可构建」
            - **调试密钥签名**（debug keystore），仅供本地验证/自测，不可用于正式分发
            - 上游该分支本身没有正式签名配置，也从未发布过正式 Release
          files: Android/bin/Release/net10.0-android/*.apk
