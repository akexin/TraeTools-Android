name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 拉取完整历史与所有 tag，供生成"上一版本→本版本"更新差异
          fetch-tags: true

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 发布单文件自包含 exe：应用内更新器（UpdaterService）会下载名为 TraeTools.exe 的资产，
      # 直接覆盖本地 exe 后重启，因此必须产出可独立运行的单文件程序。
      # 注意：RuntimeIdentifier(win-x64) 定义在 csproj 的 windows 条件组内，
      # 不能在此用 -r 传入（全局属性会污染 android TFM 的还原，报 NU1102）。
      - name: Publish (self-contained single-file win-x64)
        run: dotnet publish TraeTools.csproj -c Release -f net10.0-windows --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip distribution
        shell: powershell
        run: |
          Compress-Archive -Path publish\* -DestinationPath TraeTools-win-x64.zip -Force
          Get-ChildItem -Path publish, TraeTools-win-x64.zip | Select-Object Name, Length

      # 自动生成更新摘要：取「版本号不大于当前版本」的最近一个 v* tag，
      # 汇总其到本版本之间的全部提交（跳过 merge 提交）。
      # 注意：仓库保留着重构前的历史 tag（如 v1.5.2.1），必须排除版本号大于当前的，否则会选错上一版本。
      - name: Generate release notes
        shell: bash
        run: |
          set -e
          CUR="${GITHUB_REF_NAME#v}"
          PREV=""
          for t in $(git tag --list 'v*' --sort=-version:refname); do
            v="${t#v}"
            [ "$v" = "$CUR" ] && continue
            # 四段式版本比较（v1.0.2.2 / v1.0.3）
            gt=0
            IFS=. read -ra A <<< "$v"; IFS=. read -ra B <<< "$CUR"
            for i in 0 1 2 3; do
              x=${A[$i]:-0}; y=${B[$i]:-0}
              if (( x > y )); then gt=1; break; fi
              if (( x < y )); then break; fi
            done
            [ "$gt" = "1" ] && continue   # 大于当前版本（历史遗留超前 tag）跳过
            PREV="$t"; break
          done
          {
            echo "TraeTools ${GITHUB_REF_NAME}"
            echo ""
            echo "- 单文件自包含 Windows x64 程序（无需额外安装 .NET 运行时）"
            echo "- Android 手机版 APK（Android 8.0+，见 TraeTools-Android.apk）"
            echo "- 应用内「检查更新」为**非强制**：仅提示，经用户确认后才下载安装（Windows 端后台替换，Android 端跳转下载页手动安装），可随时取消"
            echo ""
            if [ -n "${PREV}" ]; then
              echo "## 更新差异（${PREV} → ${GITHUB_REF_NAME}）"
              echo ""
              git log --oneline --no-merges "${PREV}..HEAD" || true
              echo ""
              echo "> 由提交记录自动生成，完整变更请查看 Commits"
            else
              echo "（未找到上一版本 tag，此为首个版本）"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TraeTools ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            publish/TraeTools.exe
            TraeTools-win-x64.zip
          generate_release_notes: false

  publish-android:
    runs-on: ubuntu-latest
    needs: publish          # 等 Windows  job 创建好 Release 后再追加 APK 资产
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      # Android APK：使用仓库内置签名密钥（signing/traetools.keystore）签名。
      # 不用 SDK 默认的临时 debug keystore——它每次运行都重新生成，会导致各版本签名
      # 不一致、无法覆盖安装。AndroidKeyStore=true 时产出的签名产物名为 *-Signed.apk。
      # EnableWindowsTargeting：多目标项目还原需一并还原 net10.0-windows，ubuntu 上必须显式开启
      - name: Publish (android apk, signed)
        run: |
          dotnet publish TraeTools.csproj -c Release -f net10.0-android \
            -p:EnableWindowsTargeting=true \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$PWD/signing/traetools.keystore" \
            -p:AndroidSigningKeyAlias=traetools \
            -p:AndroidSigningKeyPass=traetools \
            -p:AndroidSigningStorePass=traetools \
            -o publish-android

      - name: Collect apk
        run: |
          echo "== publish-android 中的 APK 候选（未签名的 *.apk 不可安装，必须取 *-Signed.apk）=="
          find publish-android -name "*.apk" -printf "%s\t%p\n" | sort -rn || true
          APK=$(find publish-android -iname "*-Signed.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::no signed apk produced"; exit 1; fi
          echo "selected: $APK"
          cp "$APK" TraeTools-Android.apk
          ls -lh TraeTools-Android.apk

      # ===== 签名校验门禁 =====
      # 旧实现只 `apksigner verify --print-certs | head -8 || true`：既不校验退出码，
      # 也不比对指纹，等于「打印一下就放行」。签名一旦出问题（密钥被换、方案缺失、
      # 误传未签名包），用户侧表现为「应用未安装 / 签名验证不通过」，而 CI 全绿。
      # 现在改为硬门禁：任一条件不满足即中断发布。
      - name: Verify APK signature (gate)
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          [ -n "$BT" ] && [ -x "$BT/apksigner" ] || { echo "::error::apksigner not found"; exit 1; }
          echo "== apksigner verify --verbose --print-certs =="
          # 退出码是主判据：apksigner 对签名无效/缺方案会返回非 0
          "$BT/apksigner" verify --verbose --print-certs TraeTools-Android.apk | tee verify.txt

          # 指纹比对：基准由 rotate-keystore.yml 生成，避免两处手工同步
          EXPECTED=$(tr -d ': \r\n' < signing/EXPECTED_CERT_SHA256.txt 2>/dev/null || true)
          ACTUAL=$(sed -n 's/.*certificate SHA-256 digest: *//p' verify.txt | head -1 | tr -d ': \r\n')
          echo "expected = ${EXPECTED:-<缺失>}"
          echo "actual   = ${ACTUAL:-<未解析到>}"
          [ -n "$EXPECTED" ] || { echo "::error::缺少 signing/EXPECTED_CERT_SHA256.txt"; exit 1; }
          [ -n "$ACTUAL" ] || { echo "::error::未能从 apksigner 输出解析证书 SHA-256"; exit 1; }
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::签名证书指纹与 EXPECTED_CERT_SHA256.txt 不一致（密钥被换或产物来源不对）"; exit 1; }
          echo "✅ 证书指纹一致"

      # 结构性校验三种签名方案是否齐全。刻意不复用 apksigner 的文本输出——
      # 不同 build-tools 版本的行格式不同（实测本仓库 CI 输出的是 "V3.0 Signer:" 而非
      # "Signer #1 certificate ..."），文本 grep 不可靠；直接解析 APK 二进制最稳。
      - name: Verify signature schemes present (v1 + v2 + v3)
        run: |
          python3 - <<'PY'
          import os
          import struct
          import sys
          import zipfile

          APK = "TraeTools-Android.apk"
          ok = True

          # --- v1：JAR 签名文件存在于 META-INF ---
          with zipfile.ZipFile(APK) as z:
              names = [n for n in z.namelist() if n.upper().startswith("META-INF/")]
          blk = [n for n in names if n.upper().endswith((".RSA", ".DSA", ".EC"))]
          sf  = [n for n in names if n.upper().endswith(".SF")]
          mf  = [n for n in names if n.upper().endswith("MANIFEST.MF")]
          v1 = bool(blk and sf and mf)
          print(f"v1 (JAR)        : {'存在' if v1 else '缺失'}  block={blk} SF={sf} MF={mf}")
          ok = ok and v1

          # --- v2 / v3：APK Signing Block 中的方案 ID ---
          total = os.path.getsize(APK)
          with open(APK, "rb") as f:
              f.seek(max(0, total - 65536))
              tail = f.read()

          magic_rel = tail.rfind(b"APK Sig Block 42")
          ids = {}
          if magic_rel < 0:
              print("APK Signing Block: 未找到（v2/v3 必然缺失）")
          else:
              size_of_block = struct.unpack_from("<Q", tail, magic_rel - 8)[0]
              pos = magic_rel - size_of_block + 8 + 8   # 跳过 size(8) 与首对的开头
              end = magic_rel - 8                       # 尾部的 size 字段之前
              while pos < end:
                  ln = struct.unpack_from("<Q", tail, pos)[0]
                  if ln < 4 or pos + 8 + ln > end:
                      break
                  ids[struct.unpack_from("<I", tail, pos + 8)[0]] = ln
                  pos += 8 + ln

          for sid, label in ((0x7109871A, "v2 (scheme v2)"), (0xF05368C0, "v3 (scheme v3)")):
              hit = sid in ids
              print(f"{label:<16}: {'存在' if hit else '缺失'}  (id=0x{sid:08X})")
              ok = ok and hit

          if not ok:
              sys.exit("::error::签名方案不完整，拒绝发布")
          print("✅ v1 + v2 + v3 三种签名方案齐全")
          PY

      - name: Upload apk to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TraeTools ${{ github.ref_name }}"
          files: TraeTools-Android.apk
          generate_release_notes: false
