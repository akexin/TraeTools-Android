name: Rotate Keystore

# 手动触发的 APK 签名密钥轮换工具。
#
# 为什么需要它：开发机没有 JDK，用其它工具（OpenSSL/Python 等）生成的 PKCS#12 在 Java
# 侧的 alias 映射存在不确定性；用构建机上自带的 keytool 生成，alias / 口令 / 编码格式
# 一定与 release.yml 中的 AndroidSigningKeyAlias、*Pass 参数完全一致。
#
# ⚠️ 轮换密钥后，所有已安装用户都无法覆盖安装，必须先卸载旧版再装新版。
# 触发方式：Actions → Rotate Keystore → Run workflow

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "密钥别名（须与 release.yml 的 AndroidSigningKeyAlias 一致）"
        required: true
        default: "traetools"
      password:
        description: "storepass 与 keypass（须与 release.yml 一致）"
        required: true
        default: "traetools"
      dname:
        description: "证书主体（X.500 格式）"
        required: true
        default: "CN=TraeTools, O=akexin, C=CN"
      validity_days:
        description: "证书有效期（天）"
        required: true
        default: "10950"
      commit:
        description: "是否把新密钥提交回本分支（取消则只打印 + 上传 artifact，用于试生成）"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK（提供 keytool）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 编码格式刻意与旧密钥保持一致（legacy PKCS#12 / PBE-SHA1-3DES）：
      # 这是仓库里已验证可被 Android 构建链读取的格式，换新格式没有必要且会引入不确定性。
      - name: 生成新密钥（keytool，alias 固定）
        env:
          ALIAS: ${{ inputs.alias }}
          PASS: ${{ inputs.password }}
          DNAME: ${{ inputs.dname }}
          DAYS: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          mkdir -p signing
          rm -f signing/traetools.keystore
          keytool -genkeypair \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA \
            -validity "$DAYS" \
            -dname "$DNAME" \
            -keystore signing/traetools.keystore \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -J-Dkeystore.pkcs12.legacy=true
          ls -l signing/traetools.keystore

      - name: 打印别名与指纹，并写入 signing/EXPECTED_CERT_SHA256.txt
        env:
          PASS: ${{ inputs.password }}
        run: |
          set -euo pipefail
          KS=signing/traetools.keystore
          echo "===== keytool -list -v ====="
          keytool -list -v -keystore "$KS" -storetype PKCS12 -storepass "$PASS"
          echo
          echo "===== 汇总 ====="
          echo "别名条目："
          keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$PASS" | sed -n '3,12p'
          FP=$(keytool -list -v -keystore "$KS" -storetype PKCS12 -storepass "$PASS" \
               | sed -n 's/.*SHA256: *//p' | head -1 | tr -d ': \r')
          if [ -z "$FP" ]; then echo "::error::未能解析证书 SHA-256"; exit 1; fi
          echo "CERT_SHA256_COLONS=$(echo "$FP" | sed 's/\(..\)/\1:/g; s/:$//')"
          # 落盘供 release.yml 作为签名校验门禁的比对基准（避免两处手工同步）
          printf '%s\n' "$FP" > signing/EXPECTED_CERT_SHA256.txt
          echo "---- signing/EXPECTED_CERT_SHA256.txt ----"
          cat signing/EXPECTED_CERT_SHA256.txt
          echo
          echo "===== base64（便于本地核对，与文件内容一致）====="
          base64 -w 0 "$KS"; echo

      - name: 提交回仓库
        if: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "akexin"
          git config user.email "315600306+akexin@users.noreply.github.com"
          git add signing/traetools.keystore signing/EXPECTED_CERT_SHA256.txt
          if git diff --cached --quiet; then
            echo "密钥与指纹均未变化，无需提交"
          else
            git commit \
              -m "chore(signing): 轮换 APK 签名密钥（keytool 生成，alias=${{ inputs.alias }}）" \
              -m "由 .github/workflows/rotate-keystore.yml 手动触发。轮换后所有已安装用户必须卸载旧版才能安装新版。同时更新 signing/EXPECTED_CERT_SHA256.txt（release.yml 的签名校验门禁基准）。"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
